<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <!-- Bright gradients for each stroke -->
    <linearGradient id="gradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#12F25E"/>
      <stop offset="100%" stop-color="#F5F90A"/>
    </linearGradient>
    <linearGradient id="gradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00D4"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFE600"/>
    </linearGradient>

    <!-- Roughen edges globally -->
    <filter id="roughEdge" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <!-- Base noise -->
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="7" result="noise"/>
      <!-- Gentle blur to make noise chunkier -->
      <feGaussianBlur in="noise" stdDeviation="0.8" result="softNoise"/>
      <!-- Displace the source graphic by noise to fray edges -->
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Extra jitter for spatter tips -->
    <filter id="spatterJitter" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.06" numOctaves="1" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Subtle inner grain so middles stay solid but not flat -->
    <filter id="subtleGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <!-- Transparent background by default -->
  <g transform="skewX(8)">
    <!-- Vertical stroke: thick, slightly curved -->
    <path d="M512 160 C 560 280 560 744 512 864" fill="none" stroke="url(#gradV)" stroke-width="200" stroke-linecap="round" filter="url(#roughEdge)"/>

    <!-- Horizontal stroke: thick, slightly curved -->
    <path d="M256 512 C 384 470 640 554 768 512" fill="none" stroke="url(#gradH)" stroke-width="200" stroke-linecap="round" filter="url(#roughEdge)"/>

    <!-- Frayed spatter at ends - vertical top -->
    <g transform="translate(512,160)" filter="url(#spatterJitter)" opacity="0.8">
      <path d="M -10 -12 L 10 -12 L 0 -120 Z" fill="url(#gradV)"/>
      <path d="M -6 -8 L 6 -8 L 0 -80 Z" fill="url(#gradV)" opacity="0.7"/>
      <path d="M -14 -6 L 14 -6 L 0 -70 Z" fill="url(#gradV)" opacity="0.55"/>
      <path d="M -22 -10 L -4 -10 L -9 -90 Z" fill="url(#gradV)" opacity="0.6"/>
      <path d="M 4 -10 L 22 -10 L 9 -92 Z" fill="url(#gradV)" opacity="0.6"/>
    </g>

    <!-- Frayed spatter at ends - vertical bottom -->
    <g transform="translate(512,864) rotate(180)" filter="url(#spatterJitter)" opacity="0.8">
      <path d="M -10 -12 L 10 -12 L 0 -120 Z" fill="url(#gradV)"/>
      <path d="M -6 -8 L 6 -8 L 0 -80 Z" fill="url(#gradV)" opacity="0.7"/>
      <path d="M -14 -6 L 14 -6 L 0 -70 Z" fill="url(#gradV)" opacity="0.55"/>
      <path d="M -22 -10 L -4 -10 L -9 -90 Z" fill="url(#gradV)" opacity="0.6"/>
      <path d="M 4 -10 L 22 -10 L 9 -92 Z" fill="url(#gradV)" opacity="0.6"/>
    </g>

    <!-- Frayed spatter at ends - horizontal left -->
    <g transform="translate(256,512) rotate(-90)" filter="url(#spatterJitter)" opacity="0.8">
      <path d="M -10 -12 L 10 -12 L 0 -120 Z" fill="url(#gradH)"/>
      <path d="M -6 -8 L 6 -8 L 0 -80 Z" fill="url(#gradH)" opacity="0.7"/>
      <path d="M -14 -6 L 14 -6 L 0 -70 Z" fill="url(#gradH)" opacity="0.55"/>
      <path d="M -22 -10 L -4 -10 L -9 -90 Z" fill="url(#gradH)" opacity="0.6"/>
      <path d="M 4 -10 L 22 -10 L 9 -92 Z" fill="url(#gradH)" opacity="0.6"/>
    </g>

    <!-- Frayed spatter at ends - horizontal right -->
    <g transform="translate(768,512) rotate(90)" filter="url(#spatterJitter)" opacity="0.8">
      <path d="M -10 -12 L 10 -12 L 0 -120 Z" fill="url(#gradH)"/>
      <path d="M -6 -8 L 6 -8 L 0 -80 Z" fill="url(#gradH)" opacity="0.7"/>
      <path d="M -14 -6 L 14 -6 L 0 -70 Z" fill="url(#gradH)" opacity="0.55"/>
      <path d="M -22 -10 L -4 -10 L -9 -90 Z" fill="url(#gradH)" opacity="0.6"/>
      <path d="M 4 -10 L 22 -10 L 9 -92 Z" fill="url(#gradH)" opacity="0.6"/>
    </g>
  </g>
</svg>
